name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The platforms uv.lock can install: antimony and libroadrunner
        # publish wheels for these and no others.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so a forgotten `uv lock` cannot slip through.
      - run: uv sync --locked

      - run: uv run pytest -q

  examples:
    name: documented examples still run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # The docs quote these scripts' output; if they stop working the
      # documentation has silently gone stale.
      - run: uv run python docs/examples/run_all.py

  build:
    name: package builds and passes twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - run: uvx twine check dist/*
