# ---------------------------------------------------------------------------
# Six-tier feed-forward cascade, fitted in six modules -- one per tier.
#
#   L -> R -| -> X1 -| -> X2 -| -> M -| -> P -| -> M2 -| -> P2
#   (receptor)  (kinase1) (kinase2) (mRNA)   (protein) (mRNA2)  (protein2)
#
# Each tier's own response time is several-fold slower than the one before it
# (roughly tau ~ 0.1, 1, 2, 10, 50, 150, 500), and the coupling is purely
# one-directional -- there is no feedback loop back onto an earlier tier, in
# contrast to the repressilator's ring. This is the textbook case for
# divide-and-conquer: each module's own species reach their local dynamics
# while seeing an approximately quasi-steady input from upstream, rather than
# a still-evolving transient it has to fit jointly.
#
# Two experiments (`data/`) vary the stimulus dose L; both measure all seven
# species with one log-spaced time grid spanning the full range of tiers.
#
# Run it with:   pymodest fit config_modular.toml
# ---------------------------------------------------------------------------

[study]
name = "cascade-modular"
output_dir = "results_modular"

# ------------------------------------------------------------------ models --

[[models]]
id = "cascade"
antimony_file = "models/cascade.ant"
description = "six-tier feed-forward signaling-to-gene-expression cascade"

# ---------------------------------------------------------------- datasets --

[[datasets]]
id = "high"
model = "cascade"
file = "data/cascade_high.csv"
format = "wide"
weight = 1.0
description = "high stimulus dose (L=2.0)"
[datasets.conditions]
L = 2.0

[[datasets]]
id = "low"
model = "cascade"
file = "data/cascade_low.csv"
format = "wide"
weight = 1.0
description = "low stimulus dose (L=0.5)"
[datasets.conditions]
L = 0.5

# ----------------------------------------------------------------- modules --

[[modules]]
id = "receptor"
description = "tier 1 -- receptor activation (tau ~ 0.1)"
variables = ["R"]

[[modules.parameters]]
name = "k1on"
lower = 0.25
upper = 36
init = 13.5
scale = "log"

[[modules.parameters]]
name = "k1off"
lower = 0.125
upper = 18
init = 0.333333
scale = "log"


