# ----------------------------------------------------------------- fitting --

[fitting]
max_loops = 8
module_order = "as_listed"
tol = 1e-3
patience = 2
seed = 7

[fitting.optimizer]
name = "differential_evolution"
maxiter = 60
popsize = 15
tol = 1e-8
polish = true

[fitting.objective]
# "relative" (diff / |observed|) blows up near-zero points, and this model's
# seven species span magnitudes from ~0.1 (X2) to ~800 (P2) -- no single
# epsilon floor works for all of them. "max_normalized" divides each
# variable's residuals by that variable's own peak observed value instead,
# which handles the scale spread cleanly.
scaling = "max_normalized"
aggregation = "mean"

[fitting.simulation]
integrator = "cvode"
relative_tolerance = 1e-8
absolute_tolerance = 1e-10
