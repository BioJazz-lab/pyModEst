upper = 4.2
init = 1.575
scale = "log"

[[modules.parameters]]
name = "Km3a"
lower = 0.0166667
upper = 2.4
init = 0.0444444
scale = "log"

[[modules.parameters]]
name = "k3f"
lower = 0.0233333
upper = 3.36
