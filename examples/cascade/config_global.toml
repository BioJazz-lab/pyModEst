# ---------------------------------------------------------------------------
# Six-tier feed-forward cascade, fitted GLOBALLY: every parameter in one
# module, optimized together in a single joint search. Same model, same data,
# same objective and optimizer settings as config_modular.toml -- the only
# difference is the partition: one module of 24 parameters instead of six
# modules of 2-7.
#
# See the README for what to expect: the two are a statistical tie here,
# unlike ../repressilator where global wins decisively.
# ---------------------------------------------------------------------------

[study]
name = "cascade-global"
output_dir = "results_global"

# ------------------------------------------------------------------ models --

[[models]]
id = "cascade"
antimony_file = "models/cascade.ant"
description = "six-tier feed-forward signaling-to-gene-expression cascade"

# ---------------------------------------------------------------- datasets --

[[datasets]]
id = "high"
model = "cascade"
file = "data/cascade_high.csv"
format = "wide"
weight = 1.0
description = "high stimulus dose (L=2.0)"
[datasets.conditions]
L = 2.0

[[datasets]]
id = "low"
model = "cascade"
file = "data/cascade_low.csv"
format = "wide"
weight = 1.0
description = "low stimulus dose (L=0.5)"
[datasets.conditions]
L = 0.5

# ----------------------------------------------------------------- modules --

# A single module holding every parameter, scored on every species: this is
# what makes the fit "global" rather than divide-and-conquer. Bounds, inits
# and scales match the per-parameter settings in cascade_modular.toml
# exactly, so the two studies start from the same point in the same space.

[[modules]]
id = "all"
description = "every parameter, fitted jointly"
variables = ["R", "X1", "X2", "M", "P", "M2", "P2"]

[[modules.parameters]]
name = "k1on"
lower = 0.25
upper = 36
