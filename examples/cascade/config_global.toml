# ----------------------------------------------------------------- fitting --

[fitting]
max_loops = 8
module_order = "as_listed"
tol = 1e-3
patience = 2
seed = 7

[fitting.optimizer]
name = "differential_evolution"
maxiter = 60
popsize = 15
tol = 1e-8
polish = true

[fitting.objective]
# see cascade_modular.toml: max_normalized avoids the near-zero blowup that
# "relative" scaling causes given this model's wide magnitude spread across
# species.
scaling = "max_normalized"
aggregation = "mean"

[fitting.simulation]
integrator = "cvode"
relative_tolerance = 1e-8
absolute_tolerance = 1e-10
